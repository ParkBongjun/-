<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 점검 중</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "돋움", Dotum, "굴림", Gulim, sans-serif;
      background-color: #d4d0c8;
      color: #000;
      font-size: 12px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: #000080;
      color: #fff;
      padding: 4px 10px;
      font-size: 11px;
      text-align: right;
    }

    .header {
      background: #000080;
      color: #fff;
      padding: 12px 15px;
      border-bottom: 3px solid #0000aa;
      text-align: center;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .header-sub {
      font-size: 11px;
      margin-top: 3px;
      color: #ffff99;
    }

    .wrap {
      width: 620px;
      margin: 40px auto;
      background: #ffffff;
      border: 2px solid #808080;
      flex: 1;
    }

    .content {
      padding: 50px 40px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      color: #000080;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      color: #000080;
      margin-bottom: 18px;
    }

    .message {
      font-size: 14px;
      color: #333;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .box {
      background: #ffffcc;
      border: 1px solid #999;
      padding: 15px;
      font-size: 13px;
      color: #333;
      text-align: left;
      line-height: 1.7;
    }

    .footer {
      width: 620px;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }

    .footer .line {
      border-top: 1px solid #999;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    최종 업데이트 : 2026.08.22
  </div>

  <div class="header">
    <div class="header-title">한국정보문화개발원</div>
    <div class="header-sub">KICDI</div>
  </div>

  <div class="wrap">
    <div class="content">
      <div class="icon">⚠</div>
      <div class="title">시스템 점검 중입니다</div>
      
      <div class="message">
        현재 시스템 장애 및 보안 점검으로 인해<br>
        일시적으로 서비스를 이용하실 수 없습니다.
      </div>

      <div class="box">
        ※ 점검 시간 동안에는 지원서 접수가 불가능합니다.<br>
        ※ 점검이 완료되는 대로 정상 서비스를 재개할 예정입니다.<br>
        ※ 불편을 드려 죄송합니다.
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="line"></div>
    해당 시스템은 점검중 사이트이며 아무런 기능을 하지 못합니다.<br>
    Copyright ⓒ 1999-2001 KICDI Application System. All rights reserved.
  </div>

</body>
</html>
